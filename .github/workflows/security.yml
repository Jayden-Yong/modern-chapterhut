name: security

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # --omit=dev: the lint toolchain carries dev-only advisories that never ship
      # and would keep this job red forever.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
