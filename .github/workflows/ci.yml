name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # A green build is not evidence that data reached the page: a page can
      # silently flip to dynamic rendering and nothing in the build output says so.
      - name: Assert the store page is still statically prerendered with its rows
        run: |
          test -f .next/standalone/server.js
          grep -q '"x-nextjs-prerender": "1"' .next/server/app/store.meta
          test "$(grep -o 'NOV-[0-9]\{3\}' .next/server/app/store.html | sort -u | wc -l)" -ge 1
          test -d .next/standalone/node_modules
